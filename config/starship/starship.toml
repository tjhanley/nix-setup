# Catppuccin Latte dense powerline-style Starship prompt
add_newline = false
command_timeout = 1500
palette = "catppuccin_latte"

format = """
[](sapphire)$os$directory[](fg:sapphire bg:blue)$git_branch$git_status[](fg:blue bg:mauve)$nodejs$python$ruby$golang$rust$docker_context[](fg:mauve bg:pink)$cmd_duration[](fg:pink)$line_break$character
"""

[palettes.catppuccin_latte]
rosewater = "#dc8a78"
flamingo = "#dd7878"
pink = "#ea76cb"
mauve = "#8839ef"
red = "#d20f39"
maroon = "#e64553"
peach = "#fe640b"
yellow = "#df8e1d"
green = "#40a02b"
teal = "#179299"
sky = "#04a5e5"
sapphire = "#209fb5"
blue = "#1e66f5"
lavender = "#7287fd"
text = "#4c4f69"
subtext1 = "#5c5f77"
subtext0 = "#6c6f85"
overlay2 = "#7c7f93"
overlay1 = "#8c8fa1"
overlay0 = "#9ca0b0"
surface2 = "#acb0be"
surface1 = "#bcc0cc"
surface0 = "#ccd0da"
base = "#eff1f5"
mantle = "#e6e9ef"
crust = "#dce0e8"

[os]
disabled = false
format = "[$symbol](bg:sapphire fg:crust bold)"

[os.symbols]
Macos = " "

[directory]
style = "bg:sapphire fg:crust bold"
read_only = " "
read_only_style = "bg:sapphire fg:red bold"
truncation_length = 4
truncate_to_repo = true
format = "[ $path]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = " "
style = "bg:blue fg:crust bold"
format = "[ $symbol$branch]($style)"

[git_status]
style = "bg:blue fg:crust bold"
format = "[( $all_status$ahead_behind)]($style)"
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = "✓"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "x${count}"

[nodejs]
symbol = " "
style = "bg:mauve fg:crust bold"
format = "[ $symbol$version]($style)"

[python]
symbol = " "
style = "bg:mauve fg:crust bold"
format = "[ $symbol$version]($style)"

[ruby]
symbol = " "
style = "bg:mauve fg:crust bold"
format = "[ $symbol$version]($style)"

[golang]
symbol = " "
style = "bg:mauve fg:crust bold"
format = "[ $symbol$version]($style)"

[rust]
symbol = " "
style = "bg:mauve fg:crust bold"
format = "[ $symbol$version]($style)"

[docker_context]
symbol = " "
style = "bg:mauve fg:crust bold"
format = "[ $symbol$context]($style)"
only_with_files = true

[fill]
symbol = " "
style = "fg:overlay0"

[cmd_duration]
min_time = 300
style = "bg:pink fg:crust bold"
format = "[ 󱎫 $duration]($style)"
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"
